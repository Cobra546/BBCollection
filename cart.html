<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cart — BB Collection</title><link rel="stylesheet" href="css/style.css"><style>.cart-item{display:flex;justify-content:space-between;gap:15px;padding:18px 0;border-bottom:1px solid #252525}.cart-controls{white-space:nowrap}.cart-controls button{margin-left:5px}.cart-note{color:#888;font-size:13px}</style></head><body><header class="site-header"><a class="brand" href="index.html"><span>BB</span> COLLECTION</a><nav class="nav"><a href="index.html">Home</a><a href="shop.html">Shop</a></nav><div class="header-actions"><a href="account.html" class="account-link">👤</a></div></header><main class="section"><p class="eyebrow">YOUR BAG</p><h1>Shopping cart</h1><p id="cartAccountHint" class="cart-note"></p><div id="cartItems"></div><div id="cartSummary" style="margin-top:30px"></div></main><script src="js/supabase.js"></script><script src="js/app.js"></script><script>
const box=document.querySelector('#cartItems'),sum=document.querySelector('#cartSummary');
function esc(v){return String(v||'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]))}
function renderCart(){const c=getCart();if(!c.length){box.innerHTML='<p>Your cart is empty.</p><a class="btn" href="shop.html">SHOP NOW</a>';sum.innerHTML='';return}box.innerHTML=c.map((x,i)=>`<div class="cart-item"><div><b>${esc(x.name)}</b>${x.print_name?`<br><small style="color:#aaa">Print: <strong>${esc(x.print_name)}</strong></small>`:''}<br><small>${money(x.price)} × ${x.qty}</small></div><div class="cart-controls"><button onclick="changeQty(${i},-1)">−</button> ${x.qty} <button onclick="changeQty(${i},1)">+</button> <button onclick="removeItem(${i})">Remove</button></div></div>`).join('');const total=c.reduce((s,x)=>s+Number(x.price)*Number(x.qty),0);sum.innerHTML=`<h2>Total: ${money(total)}</h2><a class="btn" href="checkout.html">PROCEED TO CHECKOUT</a>`}
function changeQty(i,d){const c=getCart();if(!c[i])return;c[i].qty+=d;if(c[i].qty<1)c.splice(i,1);saveCart(c);renderCart()}
function removeItem(i){const c=getCart();c.splice(i,1);saveCart(c);renderCart()}
renderCart();
// Reconcile with the account in the background without replacing a freshly added local cart.
bbReady.then(async()=>{const before=JSON.stringify(getCart());await loadAccountCart();if(JSON.stringify(getCart())!==before)renderCart()}).catch(()=>{});
</script></body></html>
