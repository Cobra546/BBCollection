<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cart — BB Collection</title><link rel="stylesheet" href="css/style.css"><style>.cart-item{display:flex;justify-content:space-between;gap:15px;padding:20px 0;border-bottom:1px solid #252525}.cart-controls{white-space:nowrap}.cart-controls button{margin-left:5px}.cart-note{color:#888;font-size:13px}.cart-meta{margin-top:7px;color:#aaa;line-height:1.7}.bb-cart-title{letter-spacing:2px;text-transform:uppercase;color:#c7a978;font-size:11px}.bb-checkout-btn{display:inline-block;text-decoration:none;margin-top:10px}.bb-brand-note{max-width:700px;color:#777;line-height:1.6}.bb-size-pill{display:inline-block;padding:4px 9px;border:1px solid #555;border-radius:999px;color:#fff;font-size:11px;letter-spacing:1px;margin-right:5px}</style></head><body><header class="site-header"><a class="brand" href="index.html"><span>BB</span> COLLECTION</a><nav class="nav"><a href="index.html">Home</a><a href="shop.html">Shop</a></nav><div class="header-actions"><a href="account.html" class="account-link">👤</a></div></header><main class="section"><p class="eyebrow">BB COLLECTION / YOUR BAG</p><h1>Shopping cart</h1><p class="bb-brand-note">STAY RARE — your selected size and optional print name are saved with every item.</p><p id="cartAccountHint" class="cart-note"></p><div id="cartItems"></div><div id="cartSummary" style="margin-top:30px"></div></main><script src="js/supabase.js"></script><script src="js/app.js"></script><script>
const box=document.querySelector('#cartItems'),sum=document.querySelector('#cartSummary');
function esc(v){return String(v||'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]))}
function renderCart(){const c=getCart();if(!c.length){box.innerHTML='<p>Your cart is empty.</p><a class="btn" href="shop.html">SHOP NOW</a>';sum.innerHTML='';return}box.innerHTML=c.map((x,i)=>`<div class="cart-item"><div><span class="bb-cart-title">BB COLLECTION</span><br><b>${esc(x.name)}</b><div class="cart-meta"><span class="bb-size-pill">SIZE: ${esc(x.size||'—')}</span>${x.print_name?`<br>Print / Design: <strong>${esc(x.print_name)}</strong>`:'<br><span style="color:#666">Print / Design: Not specified</span>'}<br>${money(x.price)} × ${x.qty}</div></div><div class="cart-controls"><button onclick="changeQty(${i},-1)">−</button> ${x.qty} <button onclick="changeQty(${i},1)">+</button> <button onclick="removeItem(${i})">Remove</button></div></div>`).join('');const total=c.reduce((s,x)=>s+Number(x.price)*Number(x.qty),0);sum.innerHTML=`<h2>Total: ${money(total)}</h2><a class="btn bb-checkout-btn" href="checkout.html">PROCEED TO CHECKOUT →</a>`}
function changeQty(i,d){const c=getCart();if(!c[i])return;c[i].qty+=d;if(c[i].qty<1)c.splice(i,1);saveCart(c);renderCart()}
function removeItem(i){const c=getCart();c.splice(i,1);saveCart(c);renderCart()}
renderCart();bbReady.then(async()=>{const before=JSON.stringify(getCart());await loadAccountCart();if(JSON.stringify(getCart())!==before)renderCart()}).catch(()=>{});
</script></body></html>
