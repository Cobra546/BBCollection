<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cart — BB Collection</title><link rel="stylesheet" href="css/style.css"></head><body><header class="site-header"><a class="brand" href="index.html"><span>BB</span> COLLECTION</a><nav class="nav"><a href="index.html">Home</a><a href="shop.html">Shop</a></nav><div class="header-actions"><a href="account.html" class="account-link">👤</a></div></header><main class="section"><p class="eyebrow">YOUR BAG</p><h1>Shopping cart</h1><p id="cartAccountHint"></p><div id="cartItems">Loading cart...</div><div id="cartSummary" style="margin-top:30px"></div></main><script src="js/supabase.js"></script><script src="js/app.js"></script><script>const box=document.querySelector('#cartItems'),sum=document.querySelector('#cartSummary');async function renderCart(){await loadAccountCart();const c=getCart();if(!c.length){box.innerHTML='<p>Your cart is empty.</p><a class="btn" href="shop.html">SHOP NOW</a>';sum.innerHTML='';return}box.innerHTML=c.map((x,i)=>`<div style="display:flex;justify-content:space-between;gap:15px;padding:18px 0;border-bottom:1px solid #252525"><div><b>${x.name}</b><br><small>${money(x.price)} × ${x.qty}</small></div><div><button onclick="changeQty(${i},-1)">−</button> ${x.qty} <button onclick="changeQty(${i},1)">+</button> <button onclick="removeItem(${i})">Remove</button></div></div>`).join('');const total=c.reduce((s,x)=>s+x.price*x.qty,0);sum.innerHTML=`<h2>Total: ${money(total)}</h2><a class="btn" href="checkout.html">PROCEED TO CHECKOUT</a>`}function changeQty(i,d){const c=getCart();c[i].qty+=d;if(c[i].qty<1)c.splice(i,1);saveCart(c);renderCart()}function removeItem(i){const c=getCart();c.splice(i,1);saveCart(c);renderCart()}renderCart();</script></body></html>
