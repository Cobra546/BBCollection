<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account — BB Collection</title><link rel="stylesheet" href="css/style.css"><style>
.account-wrap{max-width:560px;margin:55px auto;padding:20px}.auth-card{background:rgba(18,18,18,.96);border:1px solid #2b2b2b;border-radius:26px;padding:32px;box-shadow:0 24px 70px rgba(0,0,0,.38)}.auth-card h1{margin:6px 0 10px;font-size:40px}.auth-sub{color:#aaa;line-height:1.6}.auth-field{position:relative;margin:18px 0}.auth-field label{display:block;font-size:10px;letter-spacing:1.8px;text-transform:uppercase;color:#888;margin:0 0 8px 4px}.premium-input{width:100%;box-sizing:border-box;background:linear-gradient(180deg,#151515,#0d0d0d);border:1px solid #303030;border-radius:15px;padding:17px 18px;color:#fff;font:inherit;outline:none;transition:border-color .25s,box-shadow .25s,transform .25s}.premium-input::placeholder{color:#666}.premium-input:hover{border-color:#444}.premium-input:focus{border-color:#aaa;box-shadow:0 0 0 4px rgba(255,255,255,.055),0 10px 30px rgba(0,0,0,.18);transform:translateY(-1px)}.auth-actions{display:grid;gap:11px}.google-btn{background:#fff!important;color:#111!important;border-color:#fff!important}.auth-divider{display:flex;align-items:center;gap:12px;color:#777;margin:22px 0}.auth-divider:before,.auth-divider:after{content:"";height:1px;background:#303030;flex:1}.switch-row{text-align:center;color:#888;margin-top:20px;font-size:14px}.text-btn{background:none;border:0;color:#fff;text-decoration:underline;cursor:pointer;font:inherit}.password-wrap{position:relative}.password-wrap .premium-input{padding-right:52px}.show-pass{position:absolute;right:9px;bottom:7px;width:40px;height:40px;border:0;background:transparent;color:#999;border-radius:10px;cursor:pointer}.show-pass:hover{background:#202020;color:#fff}.hide{display:none!important}
</style></head><body><header class="site-header"><a class="brand" href="index.html"><span>BB</span> COLLECTION</a><nav class="nav"><a href="index.html">Home</a><a href="shop.html">Shop</a><a href="cart.html">Cart</a></nav></header><main class="account-wrap"><section class="auth-card" id="authBox"><p class="eyebrow">BB COLLECTION / ACCOUNT</p><h1>My Account</h1><p class="auth-sub">Create an account once and keep your cart and orders with you across devices.</p><div class="auth-actions"><button class="btn google-btn" id="googleLogin" type="button">🔵 CONTINUE WITH GOOGLE</button></div><div class="auth-divider">OR</div><div class="auth-field"><label>Name</label><input class="premium-input" id="name" placeholder="Your name" autocomplete="name"></div><div class="auth-field"><label>Email</label><input class="premium-input" id="email" type="email" placeholder="you@example.com" autocomplete="email"></div><div class="auth-field password-wrap"><label>Password</label><input class="premium-input" id="password" type="password" placeholder="Enter your password" autocomplete="current-password"><button class="show-pass" id="showPass" type="button" aria-label="Show password">👁</button></div><div class="auth-actions"><button class="btn" id="signup" type="button">CREATE ACCOUNT</button><button class="btn ghost" id="login" type="button">LOG IN</button></div><p id="message" class="form-message"></p></section><section id="profileBox" class="auth-card hide"><p class="eyebrow">SIGNED IN</p><div style="display:flex;justify-content:space-between;gap:15px;align-items:center"><div><h2 id="profileEmail"></h2></div><button class="btn ghost" id="logout">LOG OUT</button></div><div style="margin-top:35px"><h2>My Orders</h2><div id="orders">Loading...</div></div></section></main><script src="js/supabase.js"></script><script>const waitForSupabase=()=>new Promise(r=>{if(window.bbSupabase)r(window.bbSupabase);else window.addEventListener('bb:supabase-ready',()=>r(window.bbSupabase),{once:true})});const $=id=>document.getElementById(id),msg=$('message');async function init(){const sb=await waitForSupabase();const {data}=await sb.auth.getUser();if(data.user)showProfile(sb,data.user)}async function showProfile(sb,user){$('authBox').classList.add('hide');$('profileBox').classList.remove('hide');$('profileEmail').textContent=user.email||'Account';const {data,error}=await sb.from('orders').select('id,total,status,payment_method,created_at,order_items(product_name,quantity,unit_price)').eq('user_id',user.id).order('created_at',{ascending:false});const box=$('orders');if(error){box.textContent=error.message;return}if(!data?.length){box.innerHTML='<p>No orders yet. <a href="shop.html">Start shopping →</a></p>';return}box.innerHTML=data.map(o=>`<article style="border:1px solid #252525;padding:18px;margin:14px 0;border-radius:14px"><div style="display:flex;justify-content:space-between;gap:10px"><b>Order #${o.id}</b><b>${o.status.toUpperCase()}</b></div><p>${new Date(o.created_at).toLocaleString()} · ${String(o.payment_method||'cod').toUpperCase()}</p><div>${(o.order_items||[]).map(i=>`<div>${i.product_name} × ${i.quantity} — Rs. ${Number(i.unit_price).toLocaleString('en-PK')}</div>`).join('')}</div><h3>Total: Rs. ${Number(o.total).toLocaleString('en-PK')}</h3></article>`).join('')}$('googleLogin').onclick=async()=>{msg.textContent='Opening Google...';try{const sb=await waitForSupabase();const {error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:'https://cobra546.github.io/BBCollection/account.html'}});if(error)throw error}catch(e){msg.textContent=e.message}};$('signup').onclick=async()=>{msg.textContent='Creating account...';try{const sb=await waitForSupabase();const {data,error}=await sb.auth.signUp({email:$('email').value.trim(),password:$('password').value,options:{data:{name:$('name').value.trim()}}});if(error)throw error;if(data.user&&data.session)showProfile(sb,data.user);else msg.textContent='Account created. You can now log in.'}catch(e){msg.textContent=e.message}};$('login').onclick=async()=>{msg.textContent='Logging in...';try{const sb=await waitForSupabase();const {data,error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;showProfile(sb,data.user)}catch(e){msg.textContent=e.message}};$('showPass').onclick=()=>{const p=$('password');p.type=p.type==='password'?'text':'password';$('showPass').textContent=p.type==='password'?'👁':'🙈'};$('logout').onclick=async()=>{const sb=await waitForSupabase();await sb.auth.signOut();location.reload()};init();</script></body></html>
