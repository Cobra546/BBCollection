<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account — BB Collection</title><link rel="stylesheet" href="css/style.css"></head><body><header class="site-header"><a class="brand" href="index.html"><span>BB</span> COLLECTION</a><nav class="nav"><a href="index.html">Home</a><a href="shop.html">Shop</a><a href="cart.html">Cart</a></nav></header><main class="section" style="max-width:700px;margin:60px auto"><p class="eyebrow">BB COLLECTION</p><h1>My Account</h1><section id="authBox"><p>Create an account once and your cart/orders can follow you across devices when you log into the same account.</p><div style="display:grid;gap:14px;margin-top:30px"><button class="btn" id="googleLogin" type="button">🔵 CONTINUE WITH GOOGLE</button><div style="display:flex;align-items:center;gap:12px"><span style="height:1px;background:#333;flex:1"></span><small>OR</small><span style="height:1px;background:#333;flex:1"></span></div><input id="name" placeholder="Name" autocomplete="name"><input id="email" type="email" placeholder="Email" autocomplete="email" required><input id="password" type="password" placeholder="Password" autocomplete="new-password" required><button class="btn" id="signup">CREATE ACCOUNT</button><button class="btn ghost" id="login">LOG IN</button><p id="message" class="form-message"></p></div></section><section id="profileBox" hidden style="margin-top:40px"><div style="display:flex;justify-content:space-between;gap:15px;align-items:center"><div><p class="eyebrow">SIGNED IN</p><h2 id="profileEmail"></h2></div><button class="btn ghost" id="logout">LOG OUT</button></div><div style="margin-top:35px"><h2>My Orders</h2><div id="orders">Loading...</div></div></section></main><script src="js/supabase.js"></script><script>const waitForSupabase=()=>new Promise(r=>{if(window.bbSupabase)r(window.bbSupabase);else window.addEventListener('bb:supabase-ready',()=>r(window.bbSupabase),{once:true})});const msg=document.getElementById('message');const email=()=>document.getElementById('email').value.trim();const password=()=>document.getElementById('password').value;async function init(){const sb=await waitForSupabase();const {data}=await sb.auth.getUser();if(data.user)showProfile(sb,data.user);else document.getElementById('authBox').hidden=false}async function showProfile(sb,user){document.getElementById('authBox').hidden=true;document.getElementById('profileBox').hidden=false;document.getElementById('profileEmail').textContent=user.email||'Account';const {data,error}=await sb.from('orders').select('id,total,status,payment_method,created_at,order_items(product_name,quantity,unit_price)').eq('user_id',user.id).order('created_at',{ascending:false});const box=document.getElementById('orders');if(error){box.textContent=error.message;return}if(!data?.length){box.innerHTML='<p>No orders yet. <a href="shop.html">Start shopping →</a></p>';return}box.innerHTML=data.map(o=>`<article style="border:1px solid #252525;padding:18px;margin:14px 0"><div style="display:flex;justify-content:space-between;gap:10px"><b>Order #${o.id}</b><b>${o.status.toUpperCase()}</b></div><p>${new Date(o.created_at).toLocaleString()} · ${String(o.payment_method||'cod').toUpperCase()}</p><div>${(o.order_items||[]).map(i=>`<div>${i.product_name} × ${i.quantity} — Rs. ${Number(i.unit_price).toLocaleString('en-PK')}</div>`).join('')}</div><h3>Total: Rs. ${Number(o.total).toLocaleString('en-PK')}</h3></article>`).join('')}document.getElementById('googleLogin').onclick=async()=>{msg.textContent='Opening Google...';try{const sb=await waitForSupabase();const {error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:'https://cobra546.github.io/BBCollection/account.html'}});if(error)throw error}catch(e){msg.textContent=e.message}};document.getElementById('signup').onclick=async()=>{msg.textContent='Creating account...';try{const sb=await waitForSupabase();const {data,error}=await sb.auth.signUp({email:email(),password:password(),options:{data:{name:document.getElementById('name').value.trim()}}});if(error)throw error;if(data.user&&!data.session){msg.textContent='Account created. Check your email if confirmation is enabled, then log in.'}else if(data.user){msg.textContent='Account created!';showProfile(sb,data.user)}}catch(e){msg.textContent=e.message}};document.getElementById('login').onclick=async()=>{msg.textContent='Logging in...';try{const sb=await waitForSupabase();const {data,error}=await sb.auth.signInWithPassword({email:email(),password:password()});if(error)throw error;showProfile(sb,data.user)}catch(e){msg.textContent=e.message}};document.getElementById('logout').onclick=async()=>{const sb=await waitForSupabase();await sb.auth.signOut();location.reload()};init();</script></body></html>
