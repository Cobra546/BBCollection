<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account — BB Collection</title><link rel="stylesheet" href="css/style.css"></head><body><header class="site-header"><a class="brand" href="index.html"><span>BB</span> COLLECTION</a><nav class="nav"><a href="index.html">Home</a><a href="shop.html">Shop</a><a href="cart.html">Cart</a></nav></header><main class="section" style="max-width:520px;margin:80px auto"><p class="eyebrow">BB COLLECTION</p><h1>My Account</h1><p>Sign up or log in to keep your cart and orders with your account.</p><div style="display:grid;gap:14px;margin-top:30px"><input id="name" placeholder="Name" autocomplete="name"><input id="email" type="email" placeholder="Email" autocomplete="email" required><input id="password" type="password" placeholder="Password" autocomplete="new-password" required><button class="btn" id="signup">CREATE ACCOUNT</button><button class="btn ghost" id="login">LOG IN</button><p id="message" class="form-message"></p></div></main><script src="js/supabase.js"></script><script>const msg=document.getElementById('message');const email=()=>document.getElementById('email').value.trim();const password=()=>document.getElementById('password').value;document.getElementById('signup').onclick=async()=>{msg.textContent='Creating account...';try{const {data,error}=await window.supabase.auth.signUp({email:email(),password:password(),options:{data:{name:document.getElementById('name').value.trim()}}});if(error)throw error;msg.textContent=data.session?'Account created!':'Account created. Check your email if confirmation is required.'}catch(e){msg.textContent=e.message}};document.getElementById('login').onclick=async()=>{msg.textContent='Logging in...';try{const {error}=await window.supabase.auth.signInWithPassword({email:email(),password:password()});if(error)throw error;location.href='index.html'}catch(e){msg.textContent=e.message}};</script></body></html>
