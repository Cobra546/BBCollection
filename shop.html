<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shop — BB Collection</title><link rel="stylesheet" href="css/style.css"><style>.bb-shop-note{max-width:760px;margin:0 auto 28px;text-align:center;color:#8f8f8f;line-height:1.7}.bb-brand-copy{letter-spacing:2px;text-transform:uppercase;font-size:11px;color:#c7a978}.bb-view-btn{text-decoration:none;text-align:center;display:block}</style></head><body><header class="site-header"><a class="brand" href="index.html"><span>BB</span> COLLECTION</a><nav class="nav"><a href="index.html">Home</a><a class="active" href="shop.html">Shop</a><a href="index.html#story">Our Story</a></nav><div class="header-actions"><a href="cart.html">🛒 <b id="cartCount">0</b></a></div></header><main class="section"><div class="section-head"><div><p class="eyebrow">BB COLLECTION</p><h1>Shop all</h1></div><select id="filter"><option value="all">All categories</option><option value="streetwear">Streetwear</option><option value="anime">Anime</option><option value="football">Football</option><option value="vintage">Vintage</option></select></div><p class="bb-shop-note"><span class="bb-brand-copy">STAY RARE</span><br>Tap any shirt to open its full details, choose your size, then add it to your bag or buy it instantly.</p><div class="product-grid" id="shopProducts"></div></main><script src="js/supabase.js"></script><script src="js/app.js"></script><script>const el=document.querySelector('#shopProducts');function render(){const f=document.querySelector('#filter').value;const list=f==='all'?PRODUCTS:PRODUCTS.filter(p=>p.category===f);el.innerHTML=list.map(productCard).join('');el.querySelectorAll('.wishlist-btn').forEach(b=>b.onclick=e=>{e.preventDefault();e.stopPropagation();const w=JSON.parse(localStorage.getItem('bb_wishlist')||'[]');if(!w.includes(b.dataset.id))w.push(b.dataset.id);localStorage.setItem('bb_wishlist',JSON.stringify(w));b.textContent='♥';showToast('Saved to wishlist')})}document.querySelector('#filter').onchange=render;render();</script></body></html>
