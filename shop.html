<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shop — BB Collection</title><link rel="stylesheet" href="css/style.css"></head><body><header class="site-header"><a class="brand" href="index.html"><span>BB</span> COLLECTION</a><nav class="nav"><a href="index.html">Home</a><a class="active" href="shop.html">Shop</a><a href="index.html#story">Our Story</a></nav><div class="header-actions"><a href="cart.html">🛒 <b id="cartCount">0</b></a></div></header><main class="section"><div class="section-head"><div><p class="eyebrow">BB COLLECTION</p><h1>Shop all</h1></div><select id="filter"><option value="all">All categories</option><option value="streetwear">Streetwear</option><option value="anime">Anime</option><option value="football">Football</option><option value="vintage">Vintage</option></select></div><div class="product-grid" id="shopProducts"></div></main><script src="js/supabase.js"></script><script src="js/app.js"></script><script>const el=document.querySelector('#shopProducts');function render(){const f=document.querySelector('#filter').value;const list=f==='all'?PRODUCTS:PRODUCTS.filter(p=>p.category===f);el.innerHTML=list.map(productCard).join('');el.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>addToCart(b.dataset.add))}document.querySelector('#filter').onchange=render;render();</script></body></html>
