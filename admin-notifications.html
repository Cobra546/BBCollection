<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Notifications — BB Collection</title><link rel="stylesheet" href="css/style.css"><style>.card{max-width:650px;margin:35px auto;padding:25px;border:1px solid #292929;border-radius:20px;background:#111}.status{margin-top:18px;color:#aaa;line-height:1.7}.status.ok{color:#b8ffca}.status.err{color:#ffaaa8}.btn{cursor:pointer}</style></head><body><header class="site-header"><a class="brand" href="index.html"><span>BB</span> COLLECTION</a></header><main class="section"><p class="eyebrow">ADMIN</p><h1>Push Notifications</h1><div class="card"><h2>📲 New order alerts</h2><p>Enable notifications on this phone. After that, new BB Collection orders can appear as a phone notification even when this page is not open.</p><button class="btn" id="enable">ENABLE NOTIFICATIONS</button><button class="btn ghost" id="test" style="margin-left:8px">SEND TEST</button><p id="status" class="status">Checking admin session…</p></div></main><script src="js/supabase.js"></script><script src="js/admin-push.js"></script><script>(async()=>{const status=document.querySelector('#status'),enable=document.querySelector('#enable'),test=document.querySelector('#test');await new Promise(r=>window.bbSupabase?r():window.addEventListener('bb:supabase-ready',r,{once:true}));const sb=window.bbSupabase;const {data}=await sb.auth.getUser();if(!data.user){status.textContent='Please log in to your admin account first.';enable.disabled=true;test.disabled=true;return}const {data:admin}=await sb.from('admin_users').select('user_id').eq('user_id',data.user.id).maybeSingle();if(!admin){status.textContent='This account is not an admin account.';enable.disabled=true;test.disabled=true;return}status.textContent='Admin account detected. Tap Enable Notifications on this phone.';enable.onclick=async()=>{enable.disabled=true;try{await bbEnableAdminPush();status.className='status ok';status.textContent='✅ Notifications enabled on this phone.'}catch(e){status.className='status err';status.textContent='❌ '+(e.message||'Could not enable notifications.');enable.disabled=false}};test.onclick=async()=>{test.disabled=true;try{await bbTestAdminPush();status.className='status ok';status.textContent='✅ Test notification sent.'}catch(e){status.className='status err';status.textContent='❌ '+(e.message||'Test failed.');}finally{test.disabled=false}}})();</script></body></html>
