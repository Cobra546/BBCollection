<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BB Collection — Admin</title>
<link rel="stylesheet" href="css/style.css">
<style>
:root{--gold:#c7a978;--bg:#090909;--panel:#111;--line:#252525;--muted:#929292}
body{background:radial-gradient(circle at top right,rgba(199,169,120,.09),transparent 30%),var(--bg)}
.site-header{backdrop-filter:blur(16px)}
.admin-shell{max-width:1180px;margin:0 auto;padding:30px 18px 70px}
.admin-login{max-width:440px;margin:40px auto;padding:28px;border:1px solid var(--line);border-radius:26px;background:linear-gradient(145deg,#151515,#0d0d0d);box-shadow:0 20px 60px rgba(0,0,0,.35)}
.admin-login input{width:100%;box-sizing:border-box;padding:15px 16px;margin-top:9px;border-radius:14px;border:1px solid #333;background:#0a0a0a;color:#fff;font:inherit;outline:none}.admin-login input:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(199,169,120,.08)}
.dashboard-head{display:flex;align-items:end;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:22px}.admin-kicker{font-size:11px;letter-spacing:2.5px;color:var(--gold);margin:0 0 7px}.dashboard-head h1{margin:0;font-size:clamp(30px,5vw,48px)}
.top-actions{display:flex;gap:10px;flex-wrap:wrap}.admin-btn{border:1px solid #343434;background:#151515;color:#fff;padding:12px 16px;border-radius:14px;font-weight:700;cursor:pointer;font:inherit;transition:.22s}.admin-btn:hover{transform:translateY(-2px);border-color:#777}.admin-btn.gold{background:linear-gradient(135deg,#d6ba86,#9f7b3f);color:#0a0a0a;border:0}.admin-btn.danger{color:#ff9b9b}
.admin-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:22px}.stat-card{padding:18px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(145deg,#151515,#0d0d0d);box-shadow:0 10px 30px rgba(0,0,0,.18)}.stat-label{font-size:10px;letter-spacing:1.5px;color:var(--muted)}.stat-value{font-size:27px;font-weight:800;margin-top:5px}
.orders-toolbar{padding:14px;border:1px solid var(--line);border-radius:20px;background:#101010;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}.orders-toolbar input{min-width:240px;flex:1;padding:13px 15px;border-radius:13px;border:1px solid #303030;background:#090909;color:#fff;font:inherit}.filter-pills{display:flex;gap:8px;flex-wrap:wrap}.filter-pill{border:1px solid #333;background:#161616;color:#aaa;border-radius:999px;padding:9px 12px;font-size:12px;cursor:pointer}.filter-pill.active{background:#eee;color:#111;border-color:#eee}
.orders-grid{display:grid;gap:16px}.order-card{border:1px solid var(--line);border-radius:26px;padding:18px;background:linear-gradient(145deg,#151515,#0c0c0c);box-shadow:0 14px 45px rgba(0,0,0,.22);overflow:hidden}.order-top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap}.order-id{font-size:19px;font-weight:900}.order-date{color:var(--muted);font-size:12px;margin-top:4px}.status-pill{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:8px 11px;font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;border:1px solid #343434;background:#171717}.status-pending{color:#f2c76d}.status-processing{color:#89c5ff}.status-shipped{color:#b29cff}.status-delivered{color:#7bd6a5}.status-cancelled{color:#ff8c8c}
.order-main{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(280px,.8fr);gap:16px;margin-top:16px}.customer-card,.order-items-card{padding:16px;border:1px solid #262626;border-radius:20px;background:#0d0d0d}.card-label{font-size:10px;letter-spacing:1.6px;color:var(--gold);font-weight:800;margin-bottom:10px}.customer-name{font-size:18px;font-weight:800}.customer-meta{color:#a7a7a7;font-size:13px;line-height:1.65}.location-link{display:inline-flex;align-items:center;gap:8px;margin-top:12px;padding:10px 13px;border-radius:13px;background:rgba(199,169,120,.09);border:1px solid rgba(199,169,120,.28);color:#dfc18b;text-decoration:none;font-size:12px;font-weight:800}
.item-list{display:grid;gap:10px}.order-item{display:flex;gap:12px;align-items:center;padding:10px;border:1px solid #242424;border-radius:17px;background:#111}.product-thumb{width:70px;height:84px;border-radius:13px;object-fit:cover;background:#1a1a1a;border:1px solid #292929}.product-info{min-width:0;flex:1}.product-name{font-weight:800;line-height:1.3}.product-meta{color:#999;font-size:12px;line-height:1.55;margin-top:4px}.size-chip{display:inline-block;padding:3px 8px;border:1px solid #4c4c4c;border-radius:999px;font-size:10px;font-weight:800;letter-spacing:1px;color:#ddd;margin-right:6px}
.order-footer{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-top:16px;padding-top:16px;border-top:1px solid #252525}.order-total{font-size:18px;font-weight:900}.payment-note{color:#999;font-size:12px;margin-top:3px}.status-actions{display:flex;gap:8px;flex-wrap:wrap}.status-btn{border:1px solid #333;background:#171717;color:#bbb;padding:9px 11px;border-radius:12px;font:inherit;font-size:12px;font-weight:700;cursor:pointer;transition:.2s}.status-btn:hover{border-color:var(--gold);color:#fff;transform:translateY(-1px)}.status-btn.active{background:linear-gradient(135deg,#d6ba86,#9f7b3f);color:#0b0b0b;border-color:transparent}.status-btn.cancel:hover{border-color:#a84d4d;color:#ff9b9b}
.empty{padding:45px 20px;text-align:center;border:1px dashed #333;border-radius:24px;color:#888}.admin-msg{color:#ff9b9b;margin:12px 0}.loading{padding:30px;color:#aaa}
@media(max-width:760px){.admin-stats{grid-template-columns:repeat(2,1fr)}.order-main{grid-template-columns:1fr}.orders-toolbar input{min-width:100%}.order-card{padding:14px}.product-thumb{width:62px;height:74px}}
</style>
</head>
<body>
<header class="site-header"><a class="brand" href="index.html"><span>BB</span> COLLECTION</a><a href="index.html">Storefront</a></header>
<main class="admin-shell">
<section id="loginBox" class="admin-login"><p class="admin-kicker">PRIVATE ACCESS</p><h1>Admin Dashboard</h1><p style="color:#888;line-height:1.5">Manage BB Collection orders in one place.</p>
<form id="login" style="display:grid;gap:10px;margin-top:20px"><input id="email" type="email" placeholder="Admin email" required><input id="password" type="password" placeholder="Password" required><button class="btn">SIGN IN</button><p id="loginMsg" class="admin-msg"></p></form></section>
<section id="dashboard" hidden>
<div class="dashboard-head"><div><p class="admin-kicker">BB COLLECTION / CONTROL ROOM</p><h1>Orders Dashboard</h1></div><div class="top-actions"><button class="admin-btn" id="refreshBtn">↻ REFRESH</button><button class="admin-btn danger" id="logout">LOG OUT</button></div></div>
<div class="admin-stats"><div class="stat-card"><div class="stat-label">TOTAL ORDERS</div><div class="stat-value" id="statTotal">0</div></div><div class="stat-card"><div class="stat-label">PENDING</div><div class="stat-value" id="statPending">0</div></div><div class="stat-card"><div class="stat-label">PROCESSING</div><div class="stat-value" id="statProcessing">0</div></div><div class="stat-card"><div class="stat-label">DELIVERED</div><div class="stat-value" id="statDelivered">0</div></div></div>
<div class="orders-toolbar"><input id="searchOrders" placeholder="Search customer, phone, email or order ID"><div class="filter-pills"><button class="filter-pill active" data-filter="all">All</button><button class="filter-pill" data-filter="pending">Pending</button><button class="filter-pill" data-filter="processing">Processing</button><button class="filter-pill" data-filter="shipped">Shipped</button><button class="filter-pill" data-filter="delivered">Delivered</button></div></div>
<div id="orders" class="orders-grid"><div class="loading">Loading orders…</div></div>
</section></main>
<script src="js/supabase.js"></script><script src="js/app.js"></script>
<script>
const login=document.querySelector('#login'),dash=document.querySelector('#dashboard'),loginBox=document.querySelector('#loginBox'),msg=document.querySelector('#loginMsg'),orders=document.querySelector('#orders'),searchOrders=document.querySelector('#searchOrders');
let allOrders=[],activeFilter='all';
const productMap=()=>new Map((window.PRODUCTS||[]).map(p=>[String(p.id),p]));
function esc(v){return String(v??'').replace(/[&<>\\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\"':'&quot;',"'":'&#39;'}[c]))}
function statusClass(s){return 'status-'+String(s||'pending').toLowerCase()}
function statusDot(s){return ({pending:'●',processing:'◐',shipped:'◉',delivered:'✓',cancelled:'×'}[String(s||'pending').toLowerCase()]||'●')}
function productFor(item){const map=productMap();return map.get(String(item.product_id))||(window.PRODUCTS||[]).find(p=>String(p.name).trim().toLowerCase()===String(item.product_name||'').trim().toLowerCase())||null}
function itemImage(item){const p=productFor(item);return p?.image||'assets/bb-streetwear-1650.svg'}
function locationButton(o){const lat=Number(o.latitude),lon=Number(o.longitude);if(!Number.isFinite(lat)||!Number.isFinite(lon))return '';const href=`https://www.google.com/maps?q=${encodeURIComponent(lat+','+lon)}`;return `<a class="location-link" href="${href}" target="_blank" rel="noopener noreferrer">📍 VIEW CUSTOMER LOCATION</a>`}
function updateStats(){const count=s=>allOrders.filter(o=>String(o.status||'pending').toLowerCase()===s).length;statTotal.textContent=allOrders.length;statPending.textContent=count('pending');statProcessing.textContent=count('processing');statDelivered.textContent=count('delivered')}
function renderOrders(){const q=searchOrders.value.trim().toLowerCase();const filtered=allOrders.filter(o=>{const status=String(o.status||'pending').toLowerCase();const text=[o.id,o.customer_name,o.phone,o.email,o.city,o.address].join(' ').toLowerCase();return (activeFilter==='all'||status===activeFilter)&&(!q||text.includes(q))});if(!filtered.length){orders.innerHTML='<div class="empty">No orders found.</div>';return}orders.innerHTML=filtered.map(o=>{const status=String(o.status||'pending').toLowerCase();const created=o.created_at?new Date(o.created_at).toLocaleString('en-PK',{dateStyle:'medium',timeStyle:'short'}):'';const items=(o.order_items||[]).map(i=>`<div class="order-item"><img class="product-thumb" src="${esc(itemImage(i))}" alt="${esc(i.product_name)}" loading="lazy" onerror="this.src='assets/bb-streetwear-1650.svg'"><div class="product-info"><div class="product-name">${esc(i.product_name)}</div><div class="product-meta"><span class="size-chip">SIZE ${esc(i.size||'—')}</span>${i.print_name?`Print: <b>${esc(i.print_name)}</b> · `:''}Qty: ${Number(i.quantity||0)} · Rs. ${Number(i.unit_price||0).toLocaleString('en-PK')}</div></div></div>`).join('');return `<article class="order-card"><div class="order-top"><div><div class="order-id">Order #${esc(o.id)}</div><div class="order-date">${esc(created)}</div></div><div class="status-pill ${statusClass(status)}">${statusDot(status)} ${esc(status)}</div></div><div class="order-main"><div class="customer-card"><div class="card-label">CUSTOMER DETAILS</div><div class="customer-name">${esc(o.customer_name)}</div><div class="customer-meta">${esc(o.phone)}<br>${esc(o.email)}<br>${esc(o.city)} · ${esc(o.address)}</div>${locationButton(o)}</div><div class="order-items-card"><div class="card-label">ORDERED ITEMS</div><div class="item-list">${items||'<div class="customer-meta">No item details available.</div>'}</div></div></div><div class="order-footer"><div><div class="order-total">Rs. ${Number(o.total||0).toLocaleString('en-PK')}</div><div class="payment-note">${esc(String(o.payment_method||'cod').toUpperCase())} · Order #${esc(o.id)}</div></div><div class="status-actions">${['pending','processing','shipped','delivered'].map(s=>`<button class="status-btn ${status===s?'active':''}" onclick="updateOrder('${o.id}','${s}')">${s[0].toUpperCase()+s.slice(1)}</button>`).join('')}<button class="status-btn cancel ${status==='cancelled'?'active':''}" onclick="updateOrder('${o.id}','cancelled')">Cancel</button></div></div></article>`}).join('')}
async function load(){orders.innerHTML='<div class="loading">Loading latest orders…</div>';const {data,error}=await bbOrderApi.getAdminOrders();if(error){orders.innerHTML='<div class="empty">Could not load orders right now.</div>';console.warn('Admin order load:',error);return}allOrders=Array.isArray(data)?data:[];updateStats();renderOrders()}
async function updateOrder(id,status){const button=event?.currentTarget;const original=button?.textContent;if(button){button.disabled=true;button.textContent='Saving…'}const r=await bbOrderApi.updateStatus(id,status);if(r.error){console.warn('Status update:',r.error);alert('Could not update order status. Please try again.')}await load();if(button){button.disabled=false;button.textContent=original}}
window.updateOrder=updateOrder;
searchOrders.addEventListener('input',renderOrders);document.querySelectorAll('.filter-pill').forEach(b=>b.addEventListener('click',()=>{activeFilter=b.dataset.filter;document.querySelectorAll('.filter-pill').forEach(x=>x.classList.toggle('active',x===b));renderOrders()}));
refreshBtn.addEventListener('click',load);logout.onclick=async()=>{await window.bbSupabase.auth.signOut();location.reload()};
async function authorize(){const {data}=await window.bbSupabase.auth.getSession();if(!data.session)return false;const u=await window.bbSupabase.auth.getUser();const check=await window.bbSupabase.from('admin_users').select('user_id').eq('user_id',u.data.user.id).maybeSingle();return !!check.data}
login.addEventListener('submit',async e=>{e.preventDefault();msg.textContent='';const {error}=await window.bbSupabase.auth.signInWithPassword({email:email.value,password:password.value});if(error){msg.textContent='Sign in failed. Please check your details.';return}if(!await authorize()){await window.bbSupabase.auth.signOut();msg.textContent='This account is not authorized as an admin.';return}loginBox.hidden=true;dash.hidden=false;load()});
window.addEventListener('bb:supabase-ready',async()=>{if(await authorize()){loginBox.hidden=true;dash.hidden=false;load()}});
</script>
</body></html>
