<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — BB Collection</title><link rel="stylesheet" href="css/style.css"></head><body><header class="site-header"><a class="brand" href="index.html"><span>BB</span> COLLECTION</a><a href="index.html">Storefront</a></header><main class="section"><p class="eyebrow">PRIVATE DASHBOARD</p><h1>Orders</h1><form id="login" style="max-width:420px;display:grid;gap:10px;margin:30px 0"><input id="email" type="email" placeholder="Admin email" required><input id="password" type="password" placeholder="Password" required><button class="btn">SIGN IN</button><p id="loginMsg" class="form-message"></p></form><div id="dashboard" hidden><button class="btn" id="logout">LOG OUT</button><div id="orders" style="margin-top:25px"></div></div></main><script src="js/supabase.js"></script><script>const login=document.querySelector('#login'),dash=document.querySelector('#dashboard'),msg=document.querySelector('#loginMsg'),orders=document.querySelector('#orders');login.addEventListener('submit',async e=>{e.preventDefault();if(!window.bbSupabase){msg.textContent='Configure Supabase first.';return}const {error}=await window.bbSupabase.auth.signInWithPassword({email:email.value,password:password.value});if(error){msg.textContent=error.message;return}const check=await window.bbSupabase.from('admin_users').select('user_id').eq('user_id',(await window.bbSupabase.auth.getUser()).data.user.id).maybeSingle();if(check.error||!check.data){await window.bbSupabase.auth.signOut();msg.textContent='This account is not authorized as an admin.';return}login.hidden=true;dash.hidden=false;load()});logout.onclick=async()=>{await window.bbSupabase.auth.signOut();location.reload()};function esc(v){return String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}async function load(){const {data,error}=await bbOrderApi.getAdminOrders();if(error){orders.innerHTML=`<p>${esc(error.message)}</p>`;return}orders.innerHTML=data.map(o=>`<article style="padding:20px 0;border-bottom:1px solid #252525"><h3>Order #${o.id}</h3><b>${esc(o.customer_name)}</b><br>${esc(o.phone)} · ${esc(o.email)} · ${esc(o.city)}<br><small>${esc(o.address)}</small><br><strong>Rs. ${Number(o.total).toLocaleString('en-PK')}</strong> · ${esc(o.payment_method||'cod').toUpperCase()} · ${esc(o.status)}<div style="margin-top:10px">${(o.order_items||[]).map(i=>`<div>${esc(i.product_name)} × ${i.quantity} — Rs. ${Number(i.unit_price).toLocaleString('en-PK')}</div>`).join('')}</div><div style="margin-top:12px"><button onclick="updateOrder('${o.id}','processing')">Processing</button> <button onclick="updateOrder('${o.id}','shipped')">Shipped</button> <button onclick="updateOrder('${o.id}','delivered')">Delivered</button> <button onclick="updateOrder('${o.id}','cancelled')">Cancel</button></div></article>`).join('')||'<p>No orders yet.</p>'}async function updateOrder(id,status){const r=await bbOrderApi.updateStatus(id,status);if(r.error)alert(r.error.message);else load()}window.addEventListener('bb:supabase-ready',async()=>{const {data}=await window.bbSupabase.auth.getSession();if(data.session){const u=await window.bbSupabase.auth.getUser();const check=await window.bbSupabase.from('admin_users').select('user_id').eq('user_id',u.data.user.id).maybeSingle();if(check.data){login.hidden=true;dash.hidden=false;load()}}});</script></body></html>
