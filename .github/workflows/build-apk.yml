name: Build BB Collection APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap
        run: npm install --global @bubblewrap/cli

      - name: Create TWA project
        run: |
          mkdir -p apk-build
          cd apk-build
          bubblewrap init --manifest https://cobra546.github.io/BBCollection/manifest.json

      - name: Build APK
        run: |
          cd apk-build
          yes | bubblewrap build --skipPwaValidation

      - name: Locate APK
        id: apk
        run: |
          APK=$(find apk-build -type f -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo 'No APK was produced.'
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BB-Collection-APK
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30
