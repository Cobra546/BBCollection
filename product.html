<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product — BB Collection</title><link rel="stylesheet" href="css/style.css"></head><body><header class="site-header"><a class="brand" href="index.html"><span>BB</span> COLLECTION</a><nav class="nav"><a href="index.html">Home</a><a href="shop.html">Shop</a><a href="cart.html">Cart</a></nav></header><main class="section" id="product"></main><script src="js/supabase.js"></script><script src="js/app.js"></script><script>const id=new URLSearchParams(location.search).get('id')||'1',p=PRODUCTS.find(x=>x.id===String(id))||PRODUCTS[0];document.querySelector('#product').innerHTML=`<div class="hero" style="padding:20px 0;max-width:none"><div class="hero-art"><div class="art-card" style="padding:0;overflow:hidden"><img src="${p.image}" alt="${p.name}" style="width:100%;height:100%;object-fit:cover;display:block"></div></div><div><p class="eyebrow">BB COLLECTION / ${p.category.toUpperCase()}</p><h1>${p.name}</h1><h2>${money(p.price)}</h2><p style="color:#aaa;line-height:1.8">Premium oversized streetwear piece with a relaxed fit. Select your size before checkout.</p><select id="size" style="padding:14px;background:#111;color:#fff;border:1px solid #333"><option>S</option><option>M</option><option>L</option><option>XL</option><option>XXL</option></select><br><button class="btn" style="margin-top:18px" id="add">ADD TO CART</button></div></div>`;document.querySelector('#add').onclick=()=>{addToCart(p.id);location.href='cart.html'};</script></body></html>
