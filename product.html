<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product — BB Collection</title><link rel="stylesheet" href="css/style.css"><style>
.bb-product-wrap{max-width:1180px;margin:auto}.bb-product-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(320px,.95fr);gap:42px;align-items:start}.bb-product-image{border:1px solid #292929;border-radius:24px;overflow:hidden;background:#111}.bb-product-image img{width:100%;display:block;aspect-ratio:1/1;object-fit:cover}.bb-kicker{letter-spacing:3px;color:#b99a6b;font-size:11px;text-transform:uppercase}.bb-product-title{font-size:clamp(36px,6vw,68px);line-height:.95;margin:12px 0}.bb-price{font-size:28px;margin:20px 0}.bb-description{color:#aaa;line-height:1.8}.bb-features{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:22px 0}.bb-feature{padding:14px;border:1px solid #292929;border-radius:14px;background:#111;text-transform:uppercase;font-size:11px;letter-spacing:1.4px}.bb-option-title{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#aaa;margin:25px 0 10px}.bb-sizes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.bb-size{position:relative}.bb-size input{position:absolute;opacity:0}.bb-size label{display:block;text-align:center;padding:14px 8px;border:1px solid #333;border-radius:12px;background:#111;cursor:pointer;font-weight:700}.bb-size input:checked+label{background:#fff;color:#090909;border-color:#fff}.bb-size-note{color:#777;font-size:12px;margin:9px 0 0}.bb-buy-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}.bb-buy-btn{border:1px solid #fff;background:#fff;color:#090909;padding:16px 12px;border-radius:4px;font-weight:900;letter-spacing:1.5px;cursor:pointer;text-transform:uppercase}.bb-buy-btn.secondary{background:#0b0b0b;color:#fff;border-color:#555}.bb-buy-btn:hover{transform:translateY(-1px)}.bb-action-panel{display:none;margin-top:14px;padding:18px;border:1px solid #3a3a3a;border-radius:16px;background:linear-gradient(180deg,#151515,#0b0b0b)}.bb-action-panel.show{display:block}.bb-action-panel label{display:block;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:#aaa;margin-bottom:8px}.bb-action-panel input{width:100%;box-sizing:border-box;background:#090909;border:1px solid #333;border-radius:12px;padding:14px;color:#fff;font:inherit}.bb-action-panel input:focus{outline:none;border-color:#aaa}.bb-action-panel p{color:#777;font-size:12px;line-height:1.5}.bb-confirm{margin-top:12px;width:100%;padding:14px;border:1px solid #c7a978;background:#c7a978;color:#080808;font-weight:900;letter-spacing:1.4px;border-radius:4px}.bb-guide{margin-top:50px;padding:25px;border:1px solid #292929;border-radius:22px;background:#101010}.bb-guide-head{display:flex;justify-content:space-between;gap:15px;align-items:end;flex-wrap:wrap}.bb-guide h2{margin:0}.bb-guide table{width:100%;border-collapse:collapse;margin-top:20px}.bb-guide th,.bb-guide td{padding:13px;border-bottom:1px solid #292929;text-align:center}.bb-guide th:first-child,.bb-guide td:first-child{text-align:left}.bb-guide th{color:#c7a978;text-transform:uppercase;font-size:11px;letter-spacing:1px}.bb-guide-note{color:#777;font-size:12px;margin-bottom:0}.bb-back{display:inline-block;margin-bottom:20px;color:#aaa;text-decoration:none}.bb-status{margin-top:12px;color:#c7a978;font-size:13px}.bb-brand-line{margin-top:20px;color:#c7a978;letter-spacing:4px;font-size:11px}
@media(max-width:800px){.bb-product-grid{grid-template-columns:1fr;gap:25px}.bb-product-title{font-size:48px}.bb-buy-row{grid-template-columns:1fr}.bb-features{grid-template-columns:1fr 1fr}.bb-guide{padding:16px;overflow-x:auto}.bb-guide table{min-width:520px}}
</style></head><body><header class="site-header"><a class="brand" href="index.html"><span>BB</span> COLLECTION</a><nav class="nav"><a href="index.html">Home</a><a href="shop.html">Shop</a><a href="cart.html">Cart</a></nav><div class="header-actions"><a href="cart.html">🛒 <b id="cartCount">0</b></a></div></header>
<main class="section bb-product-wrap" id="product"></main>
<script src="js/supabase.js"></script><script src="js/app.js"></script><script>
const id=new URLSearchParams(location.search).get('id')||'1',p=PRODUCTS.find(x=>x.id===String(id))||PRODUCTS[0];
const guide=SIZE_GUIDE;
document.querySelector('#product').innerHTML=`<a class="bb-back" href="shop.html">← BACK TO COLLECTION</a><div class="bb-product-grid"><div class="bb-product-image"><img src="${p.image}" alt="${p.name}"></div><div><p class="bb-kicker">BB COLLECTION / ${p.category.toUpperCase()}</p><h1 class="bb-product-title">${p.name}</h1><h2 class="bb-price">${money(p.price)}</h2><p class="bb-description">Premium oversized T-shirt made for a relaxed streetwear fit. 100% cotton fabric, durable washable print and everyday comfort. Choose your size below before adding this piece to your bag or buying it instantly.</p><div class="bb-features"><div class="bb-feature">100% Cotton</div><div class="bb-feature">Washable Print</div><div class="bb-feature">Oversized Fit</div><div class="bb-feature">Premium Quality</div></div><div class="bb-option-title">01 / Select Your Size</div><div class="bb-sizes">${SIZES.map((s,i)=>`<div class="bb-size"><input id="size-${s}" type="radio" name="size" value="${s}" ${i===0?'checked':''}><label for="size-${s}">${s==='XL'?'X-LARGE':s}</label></div>`).join('')}</div><p class="bb-size-note">Select the size you want. Your selected size will be saved with the order.</p><div class="bb-buy-row"><button class="bb-buy-btn secondary" id="add">ADD TO CART</button><button class="bb-buy-btn" id="buyNow">⚡ BUY IN ONE CLICK</button></div><div class="bb-action-panel" id="actionPanel"><label for="printName">02 / Design or Print Name <span style="color:#666">(Optional)</span></label><input id="printName" maxlength="100" placeholder="e.g. Rare Species / Design 01"><p>If this product image contains multiple prints/collage options, write the exact print/design you want. Leave blank if not needed.</p><button class="bb-confirm" id="confirmAction">CONTINUE</button><div class="bb-status" id="actionStatus"></div></div><div class="bb-brand-line">STAY RARE · STAND OUT · BB COLLECTION</div></div></div><section class="bb-guide"><div class="bb-guide-head"><div><p class="bb-kicker">BB COLLECTION</p><h2>OVERSIZE SIZE GUIDE</h2></div><p class="bb-guide-note">Measurements in inches · Chest is measured across the front</p></div><table><thead><tr><th>Measurement</th><th>Small</th><th>Medium</th><th>Large</th><th>X-Large</th></tr></thead><tbody><tr><td><strong>Chest (Across)</strong></td><td>${guide.S.chest}</td><td>${guide.M.chest}</td><td>${guide.L.chest}</td><td>${guide.XL.chest}</td></tr><tr><td><strong>Body Length</strong></td><td>${guide.S.length}</td><td>${guide.M.length}</td><td>${guide.L.length}</td><td>${guide.XL.length}</td></tr></tbody></table></section>`;
let pendingAction='';const panel=document.querySelector('#actionPanel'),input=document.querySelector('#printName'),status=document.querySelector('#actionStatus');
function selectedSize(){return document.querySelector('input[name="size"]:checked')?.value||''}
function openAction(action){const size=selectedSize();if(!size){status.textContent='Please select a size first.';panel.classList.add('show');return}pendingAction=action;panel.classList.add('show');input.focus();status.textContent=`Size selected: ${size==='XL'?'X-Large':size}`}
document.querySelector('#add').onclick=()=>openAction('cart');document.querySelector('#buyNow').onclick=()=>openAction('buy');
document.querySelector('#confirmAction').onclick=()=>{const size=selectedSize(),print=input.value.trim();if(!size)return;if(pendingAction==='cart'){addToCart(p.id,size,print);location.href='cart.html';return}const item={...p,qty:1,size,print_name:print};localStorage.setItem('bb_cart',JSON.stringify([item]));updateCartCount();syncCart([item]);location.href='checkout.html'};
</script></body></html>
