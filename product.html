<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product — BB Collection</title><link rel="stylesheet" href="css/style.css"><style>.print-option{margin-top:18px;padding:16px;border:1px solid #292929;border-radius:16px;background:linear-gradient(180deg,#151515,#0d0d0d)}.print-option label{display:block;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:#aaa;margin-bottom:8px}.print-option input{width:100%;box-sizing:border-box;background:#0a0a0a;border:1px solid #333;border-radius:12px;padding:14px;color:#fff;font:inherit;outline:none}.print-option input:focus{border-color:#aaa;box-shadow:0 0 0 4px rgba(255,255,255,.05)}.print-help{color:#777;font-size:12px;margin:8px 0 0;line-height:1.5}</style></head><body><header class="site-header"><a class="brand" href="index.html"><span>BB</span> COLLECTION</a><nav class="nav"><a href="index.html">Home</a><a href="shop.html">Shop</a><a href="cart.html">Cart</a></nav></header><main class="section" id="product"></main><script src="js/supabase.js"></script><script src="js/app.js"></script><script>const id=new URLSearchParams(location.search).get('id')||'1',p=PRODUCTS.find(x=>x.id===String(id))||PRODUCTS[0];document.querySelector('#product').innerHTML=`<div class="hero" style="padding:20px 0;max-width:none"><div class="hero-art"><div class="art-card" style="padding:0;overflow:hidden"><img src="${p.image}" alt="${p.name}" style="width:100%;height:100%;object-fit:cover;display:block"></div></div><div><p class="eyebrow">BB COLLECTION / ${p.category.toUpperCase()}</p><h1>${p.name}</h1><h2>${money(p.price)}</h2><p style="color:#aaa;line-height:1.8">Premium oversized streetwear piece with a relaxed fit. Select your size before checkout.</p><select id="size" style="padding:14px;background:#111;color:#fff;border:1px solid #333"><option>S</option><option>M</option><option>L</option><option>XL</option><option>XXL</option></select><div class="print-option"><label for="printName">Print name <span style="color:#666">(Optional)</span></label><input id="printName" maxlength="100" placeholder="e.g. Design 1, Rare Species, Front Print"><p class="print-help">Agar product image collage hai, yahan jis print/design ko chahiye uska naam likh dein. Ye order ke saath humein bhi show hoga.</p></div><br><button class="btn" style="margin-top:18px" id="add">ADD TO CART</button></div></div>`;document.querySelector('#add').onclick=()=>{const print=document.querySelector('#printName').value.trim();addToCart(p.id,print);location.href='cart.html'};</script></body></html>
