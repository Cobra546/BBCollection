<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout — BB Collection</title><link rel="stylesheet" href="css/style.css"></head><body><header class="site-header"><a class="brand" href="index.html"><span>BB</span> COLLECTION</a></header><main class="section"><p class="eyebrow">CHECKOUT</p><h1>Complete your order</h1><form id="checkoutForm" style="max-width:700px;margin-top:35px;display:grid;gap:12px"><input name="name" required placeholder="Full name"><input name="phone" required placeholder="Phone number"><input name="email" type="email" required placeholder="Email"><input name="address" required placeholder="Full delivery address"><input name="city" required placeholder="City"><input name="postal_code" placeholder="Postal code"><select name="payment_method"><option value="cod">Cash on Delivery</option></select><button class="btn" type="submit">PLACE ORDER</button><p id="checkoutMessage" class="form-message"></p></form></main><script src="js/supabase.js"></script><script src="js/app.js"></script><script>document.querySelector('#checkoutForm').addEventListener('submit',async e=>{e.preventDefault();const cart=getCart();if(!cart.length){document.querySelector('#checkoutMessage').textContent='Your cart is empty.';return}const f=new FormData(e.target);const total=cart.reduce((s,x)=>s+x.price*x.qty,0);const order={customer_name:f.get('name'),phone:f.get('phone'),email:f.get('email'),address:f.get('address'),city:f.get('city'),postal_code:f.get('postal_code'),payment_method:f.get('payment_method'),items:cart,total_amount:total,status:'pending'};const msg=document.querySelector('#checkoutMessage');if(!window.bbSupabase){msg.textContent='Order form is ready, but Supabase is not configured. Add your Supabase URL and publishable key in js/supabase.js.';return}const {data,error}=await bbOrderApi.create(order);if(error){msg.textContent=error.message;return}localStorage.removeItem('bb_cart');msg.innerHTML=`Order placed successfully! Your order number is <b>${data.order_number}</b>.`;e.target.reset();updateCartCount()});</script></body></html>
