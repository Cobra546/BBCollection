name: Build BB Collection APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap
        run: npm install --global @bubblewrap/cli

      - name: Create TWA project
        run: |
          mkdir -p .bubblewrap
          cd .bubblewrap
          bubblewrap init --manifest https://cobra546.github.io/BBCollection/manifest.json

      - name: Build APK
        run: |
          cd .bubblewrap
          yes | bubblewrap build --skipPwaValidation

      - name: Find APK
        id: apk
        run: |
          APK=$(find .bubblewrap -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BB-Collection-APK
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30
